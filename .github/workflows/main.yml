name: Run Python

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Get our code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python program
  env:
    TELEGRAM_BOT_TOKEN: $
    {{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: $
    {{ secrets.TELEGRAM_CHAT_ID }}
  run: python main.py

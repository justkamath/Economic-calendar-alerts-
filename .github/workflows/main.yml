
name: Economic Calendar Alerts

on:
  workflow_dispatch:
    inputs:
      resend_alerts:
        description: "Resend all upcoming high-impact alerts"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calendar bot with automatic retries
        uses: nick-fields/retry@v3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_ALERTS: ${{ inputs.resend_alerts || false }}
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 10
          command: python main.py

      - name: Save sent alert history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent alert history"
            git push
          fi

name: Economic Calendar Alerts

on:
  workflow_dispatch:
    inputs:
      resend_alerts:
        description: "Resend upcoming event detection alerts once"
        required: true
        type: boolean
        default: false
      resend_summary:
        description: "Resend today's daily summary once"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: economic-calendar-bot
  cancel-in-progress: false

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calendar bot with automatic retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 4
          max_attempts: 3
          retry_wait_seconds: 10
          command: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_DETECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_alerts || false }}
          RESEND_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_summary || false }}
          ALERT_MIN_IMPACT: ${{ vars.ALERT_MIN_IMPACT || 'high' }}
          USE_DATABASE: ${{ vars.USE_DATABASE || 'false' }}
          CALENDAR_SOURCES: ${{ vars.CALENDAR_SOURCES || 'forex_factory' }}
          ALERT_WEEKS: ${{ vars.ALERT_WEEKS || '1' }}
          STORE_AHEAD_DAYS: ${{ vars.STORE_AHEAD_DAYS || '90' }}
          DB_KEEP_DAYS: ${{ vars.DB_KEEP_DAYS || '365' }}
          TRADING_ECONOMICS_KEY: ${{ secrets.TRADING_ECONOMICS_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
          SIGNUP_CODE: ${{ secrets.SIGNUP_CODE }}
          MAX_SUBSCRIBERS: ${{ vars.MAX_SUBSCRIBERS || '200' }}
          EXPIRY_SYNC: ${{ vars.EXPIRY_SYNC || 'on' }}

      - name: Save sent alert history and calendar database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json
          if [ -f data/calendar.db ]; then git add data/calendar.db; fi
          if [ -f subscribers.enc ]; then git add subscribers.enc; fi
          if [ -f expiry_synced.json ]; then git add expiry_synced.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update alert history and calendar data"
            # GitHub sometimes answers with a temporary server error: try again
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push failed (attempt $attempt of 5), trying again..."
              sleep $((attempt * 15))
              git pull --rebase --autostash || git rebase --abort || true
            done
            echo "Could not save after 5 attempts"
            exit 1
          fi

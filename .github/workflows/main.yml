
name: Economic Calendar Alerts

on:
  workflow_dispatch:
    inputs:
      resend_alerts:
        description: "Resend upcoming high-impact detection alerts once"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: economic-calendar-bot
  cancel-in-progress: false

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # was 10  (the job limit, near the top)


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calendar bot with automatic retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 10
          command: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_DETECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_alerts || false }}
          ALERT_MIN_IMPACT: ${{ vars.ALERT_MIN_IMPACT || 'high' }}

      - name: Save sent alert history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update alert history"
            git push
          fi
